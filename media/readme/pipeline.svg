  <text x="920" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#e5322d">A4 · 쪽번호</text>

  <text x="488" y="204" text-anchor="middle" font-size="13" fill="#57606a">Python · nbconvert · Playwright · Chromium 설치 없음 · VS Code 안에서 렌더링부터 저장까지</text>
