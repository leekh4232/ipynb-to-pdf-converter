<svg xmlns="http://www.w3.org/2000/svg" width="976" height="236" viewBox="0 0 976 236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <!-- README hero: what happens between a right-click and the PDF on disk. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c96a8"/>
