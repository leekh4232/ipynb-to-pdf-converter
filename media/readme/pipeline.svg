    <text x="338" y="100" font-size="14" font-weight="700" fill="#24292f">Webview 렌더링</text>
    <text x="338" y="122">VS Code 내장 Chromium</text>
    <text x="338" y="140">페이지 테마 · 코드 테마</text>

    <line x1="484" y1="104" x2="510" y2="104" stroke="#8c96a8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="512" y="48" width="158" height="112" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="534" cy="68" r="11" fill="url(#indigo)"/>
    <text x="534" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
    <text x="526" y="100" font-size="14" font-weight="700" fill="#24292f">캡처 · 페이지 분할</text>
    <text x="526" y="122">html2canvas</text>
    <text x="526" y="140">글자 위치 수집 · 안 자름</text>

    <line x1="672" y1="104" x2="698" y2="104" stroke="#8c96a8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="700" y="48" width="158" height="112" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="722" cy="68" r="11" fill="url(#indigo)"/>
    <text x="722" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
    <text x="714" y="100" font-size="14" font-weight="700" fill="#24292f">PDF 조립</text>
    <text x="714" y="122">pdf-lib · 투명 텍스트 층</text>
    <text x="714" y="140">AES-256 비밀번호 (선택)</text>
  </g>
  <line x1="860" y1="104" x2="886" y2="104" stroke="#8c96a8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- output -->
  <g transform="translate(892 62)">
    <path d="M0 0 h34 l14 14 v60 a4 4 0 0 1 -4 4 h-44 a4 4 0 0 1 -4 -4 v-70 a4 4 0 0 1 4 -4 z" fill="#ffffff" stroke="#9aa6c2"/>
