  <g font-size="12" fill="#57606a">
    <rect x="136" y="48" width="158" height="112" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="158" cy="68" r="11" fill="url(#indigo)"/>
    <text x="158" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
    <text x="150" y="100" font-size="14" font-weight="700" fill="#24292f">HTML 생성</text>
    <text x="150" y="122">marked · highlight.js</text>
    <text x="150" y="140">마크다운 · 코드 · 출력 셀</text>

    <line x1="296" y1="104" x2="322" y2="104" stroke="#8c96a8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="324" y="48" width="158" height="112" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="346" cy="68" r="11" fill="url(#indigo)"/>
