    <rect x="6" y="38" width="20" height="4" rx="2" fill="#2b2b2f"/>
    <rect x="6" y="47" width="30" height="16" rx="3" fill="#1d222a"/>
    <rect x="10" y="52" width="8" height="2.5" rx="1.25" fill="#c678dd"/>
    <rect x="20" y="52" width="12" height="2.5" rx="1.25" fill="#c0c6d3"/>
    <rect x="10" y="57" width="18" height="2.5" rx="1.25" fill="#98c379"/>
    <rect x="6" y="68" width="30" height="4" rx="2" fill="#c7cdd8"/>
  </g>
  <text x="72" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#3f54b5">.ipynb · .md</text>
  <line x1="110" y1="104" x2="134" y2="104" stroke="#8c96a8" stroke-width="1.5" marker-end="url(#arrow)"/>

