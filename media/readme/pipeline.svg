    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b86e0"/>
      <stop offset="1" stop-color="#3f54b5"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="975" height="235" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- input: .md behind, .ipynb in front -->
  <g transform="translate(40 54)">
    <path d="M22 0 h30 l12 12 v50 a4 4 0 0 1 -4 4 h-38 a4 4 0 0 1 -4 -4 v-58 a4 4 0 0 1 4 -4 z" fill="#ffffff" stroke="#c7cdd8"/>
