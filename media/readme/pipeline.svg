    <rect x="6" y="24" width="24" height="3.5" rx="1.75" fill="#c7cdd8"/>
    <rect x="6" y="32" width="36" height="3.5" rx="1.75" fill="#c7cdd8"/>
    <rect x="6" y="40" width="30" height="3.5" rx="1.75" fill="#c7cdd8"/>
